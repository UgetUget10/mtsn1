services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: mtsn1
      MYSQL_USER: mtsn1_app
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks: [internal]

  php:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: backend/.env
    volumes:
      - storage_data:/var/www/html/storage
    depends_on: [db]
    networks: [internal]

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    env_file: frontend/.env.local
    depends_on: [php]
    networks: [internal]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/mtsn1.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/public:/var/www/html/public:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro
    depends_on: [web, php]
    networks: [internal]

networks:
  internal:

volumes:
  db_data:
  storage_data:
  certbot_www:
  certbot_conf:
